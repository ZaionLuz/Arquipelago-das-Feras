<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinzelo 3D Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        h1 { font-size: 1.5rem; font-weight: 600; }
        .subtitle { color: #888; font-size: 0.9rem; margin-top: 4px; }
        #canvas-container {
            flex: 1;
            position: relative;
            background: #0a0a12;
        }
        canvas { display: block; }
        .controls {
            padding: 16px;
            background: rgba(0,0,0,0.4);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,107,53,0.4); }
        .btn:active { transform: translateY(0); }
        .btn.secondary { background: linear-gradient(135deg, #3a3a5e 0%, #2a2a4e 100%); }
        .info-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .info-row { display: flex; gap: 16px; font-size: 0.85rem; color: #aaa; }
        .info-label { color: #666; }
        .stats { display: flex; gap: 24px; }
        .stat { text-align: center; }
        .stat-value { font-size: 1.25rem; font-weight: 700; color: #ff6b35; }
        .stat-label { font-size: 0.7rem; color: #666; text-transform: uppercase; }
        .loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #888;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,107,53,0.2);
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .annotation {
            position: absolute;
            background: rgba(0,0,0,0.85);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            pointer-events: none;
            border: 1px solid rgba(255,107,53,0.3);
            max-width: 200px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 Cinzelo — Visualizador 3D</h1>
            <p class="subtitle">Família Fogo · Comum · Pipeline Blender → Roblox</p>
        </header>

        <div id="canvas-container">
            <canvas id="gl-canvas"></canvas>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <div>Carregando modelo GLB...</div>
            </div>
        </div>

        <div class="controls">
            <div class="info-panel">
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value" id="stat-verts">—</div>
                        <div class="stat-label">Vértices</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-faces">—</div>
                        <div class="stat-label">Faces</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-materials">—</div>
                        <div class="stat-label">Materiais</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-bones">—</div>
                        <div class="stat-label">Ossos</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-morphs">—</div>
                        <div class="stat-label">Morph Targets</div>
                    </div>
                </div>
            </div>
            <button class="btn" id="btn-reset">Resetar Câmera</button>
            <button class="btn secondary" id="btn-wireframe">Wireframe</button>
            <button class="btn secondary" id="btn-screenshot">Capturar</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // Three.js setup
        const canvas = document.getElementById('gl-canvas');
        const container = document.getElementById('canvas-container');
        const loading = document.getElementById('loading');

        const renderer = new THREE.WebGLRenderer({
            canvas,
            antialias: true,
            alpha: false
        });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);

        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.01, 100);
        camera.position.set(0, 0.3, 1.2);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = true;
        controls.minDistance = 0.3;
        controls.maxDistance = 5;
        controls.target.set(0, 0.4, 0);
        controls.update();

        // Lights
        const hemiLight = new THREE.HemisphereLight(0xffffee, 0x111122, 1.2);
        hemiLight.position.set(0, 10, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffddaa, 2.5);
        dirLight.position.set(2, 3, 2);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 10;
        dirLight.shadow.camera.left = -2;
        dirLight.shadow.camera.right = 2;
        dirLight.shadow.camera.top = 2;
        dirLight.shadow.camera.bottom = -2;
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0x4466ff, 0.8);
        dirLight2.position.set(-2, 1, -2);
        scene.add(dirLight2);

        // Ground plane for shadows
        const groundGeo = new THREE.PlaneGeometry(5, 5);
        const groundMat = new THREE.ShadowMaterial({ opacity: 0.15 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        // Emissive bloom-like effect
        const pointLight = new THREE.PointLight(0xff6600, 0, 1);
        pointLight.position.set(0, 0.5, 0);
        scene.add(pointLight);

        // Load GLB
        const loader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        let model = null;
        let mixer = null;
        let morphTargets = null;
        let wireframeMode = false;

        loader.load(
            'CINZELO_Roblox.glb',
            (gltf) => {
                model = gltf.scene;
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        // Enhance materials for fire creature
                        if (child.material) {
                            const mats = Array.isArray(child.material) ? child.material : [child.material];
                            mats.forEach(mat => {
                                mat.metalness = Math.min(mat.metalness || 0, 0.3);
                                mat.roughness = Math.max(mat.roughness || 0, 0.5);
                            });
                        }
                    }
                });
                scene.add(model);

                // Center and scale
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);

                model.position.sub(center);
                const scale = 1.0 / maxDim;
                model.scale.setScalar(scale);

                // Recalculate bounds after scaling
                const box2 = new THREE.Box3().setFromObject(model);
                const center2 = box2.getCenter(new THREE.Vector3());
                model.position.sub(center2);

                controls.target.copy(center2).multiplyScalar(scale);
                controls.update();

                // Stats
                let verts = 0, faces = 0, mats = new Set(), bones = 0, morphs = 0;
                model.traverse((child) => {
                    if (child.isMesh) {
                        verts += child.geometry.attributes.position?.count || 0;
                        faces += child.geometry.index ? child.geometry.index.count / 3 : child.geometry.attributes.position.count / 3;
                        if (child.material) {
                            const m = Array.isArray(child.material) ? child.material : [child.material];
                            m.forEach(mat => mats.add(mat.uuid));
                        }
                        if (child.morphTargetInfluences) {
                            morphs = Math.max(morphs, child.morphTargetInfluences.length);
                        }
                    }
                    if (child.isBone || child.type === 'Bone') bones++;
                });
                document.getElementById('stat-verts').textContent = verts.toLocaleString();
                document.getElementById('stat-faces').textContent = Math.round(faces).toLocaleString();
                document.getElementById('stat-materials').textContent = mats.size;
                document.getElementById('stat-bones').textContent = bones;
                document.getElementById('stat-morphs').textContent = morphs;

                // Animations
                if (gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    gltf.animations.forEach(clip => mixer.clipAction(clip).play());
                }

                loading.classList.add('hidden');
            },
            (xhr) => {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                loading.querySelector('div:last-child').textContent = `Carregando... ${percent}%`;
            },
            (err) => {
                console.error('Erro ao carregar GLB:', err);
                loading.querySelector('div:last-child').textContent = 'Erro ao carregar. Verifique se o arquivo GLB está na mesma pasta.';
                loading.querySelector('.spinner').style.display = 'none';
            }
        );

        // Animation loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (mixer) mixer.update(delta);

            // Subtle idle animation
            if (model) {
                model.rotation.y += 0.0005;
                // Breathing
                const breath = Math.sin(clock.getElapsedTime() * 1.5) * 0.005;
                model.scale.y += breath * 0.01;
            }

            // Emissive pulse
            pointLight.intensity = Math.sin(clock.getElapsedTime() * 2) * 0.5 + 0.5;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        // Controls
        document.getElementById('btn-reset').addEventListener('click', () => {
            controls.target.set(0, 0.4, 0);
            camera.position.set(0, 0.3, 1.2);
            controls.update();
        });

        document.getElementById('btn-wireframe').addEventListener('click', (e) => {
            wireframeMode = !wireframeMode;
            if (model) {
                model.traverse((child) => {
                    if (child.isMesh && child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(mat => {
                            mat.wireframe = wireframeMode;
                        });
                    }
                });
            }
            e.target.textContent = wireframeMode ? 'Sólido' : 'Wireframe';
        });

        document.getElementById('btn-screenshot').addEventListener('click', () => {
            renderer.render(scene, camera);
            const dataUrl = renderer.domElement.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'cinzelo-preview.png';
            a.click();
        });

        // Keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyR') document.getElementById('btn-reset').click();
            if (e.code === 'KeyW') document.getElementById('btn-wireframe').click();
            if (e.code === 'KeyS') document.getElementById('btn-screenshot').click();
        });
    </script>
</body>
</html>
