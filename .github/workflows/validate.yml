name: Validate Roblox build
on: [push, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: feras-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: |
          mkdir -p "$RUNNER_TEMP/feras-tools"
          curl -fL --retry 3 'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip' -o "$RUNNER_TEMP/feras-tool-0.zip"
          echo '6a740240248e872815865a2cb03b0c327f24939478f1d0081a0540cdfd77fdaa  '"$RUNNER_TEMP/feras-tool-0.zip" | sha256sum -c -
          unzip -o "$RUNNER_TEMP/feras-tool-0.zip" -d "$RUNNER_TEMP/feras-tools"
          curl -fL --retry 3 'https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip' -o "$RUNNER_TEMP/feras-tool-1.zip"
          echo '39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1  '"$RUNNER_TEMP/feras-tool-1.zip" | sha256sum -c -
          unzip -o "$RUNNER_TEMP/feras-tool-1.zip" -d "$RUNNER_TEMP/feras-tools"
          curl -fL --retry 3 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip' -o "$RUNNER_TEMP/feras-tool-2.zip"
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  '"$RUNNER_TEMP/feras-tool-2.zip" | sha256sum -c -
          unzip -o "$RUNNER_TEMP/feras-tool-2.zip" -d "$RUNNER_TEMP/feras-tools"
          chmod +x "$RUNNER_TEMP/feras-tools/"*
          echo "$RUNNER_TEMP/feras-tools" >> "$GITHUB_PATH"
      - name: Verify source and build
        run: bash scripts/test
      - name: Package tester build
        run: |
          rojo build -o /tmp/Feras-Tester.rbxlx
          python3 scripts/check_bundle_sources.py /tmp/Feras-Tester.rbxlx
          python3 scripts/emit_build.py /tmp/Feras-Tester.rbxlx
      - name: Verify committed tester releases
        if: hashFiles('releases/Feras-Tester.rbxlx') != ''
        run: python3 scripts/check_releases.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feras-headless-review
          path: |
            /tmp/Feras-Tester.rbxlx
            docs/MODEL_METRICS.json
          retention-days: 14
